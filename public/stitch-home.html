<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed": "#1a1c1c",
                    "inverse-primary": "#ae2f34",
                    "surface-container-high": "#2a2a2a",
                    "tertiary": "#c7c6c6",
                    "on-surface-variant": "#e0bfbd",
                    "surface-container-highest": "#353535",
                    "secondary-container": "#7f5a00",
                    "outline-variant": "#584140",
                    "on-error-container": "#ffdad6",
                    "on-primary-fixed-variant": "#8c1520",
                    "tertiary-fixed-dim": "#c7c6c6",
                    "tertiary-container": "#9b9b9b",
                    "background": "#131313",
                    "surface-dim": "#131313",
                    "surface-container-low": "#1b1b1b",
                    "primary-fixed": "#ffdad8",
                    "primary-fixed-dim": "#ffb3b0",
                    "outline": "#a78a88",
                    "on-background": "#e2e2e2",
                    "on-tertiary-fixed-variant": "#464747",
                    "tertiary-fixed": "#e3e2e2",
                    "error-container": "#93000a",
                    "surface-container": "#1f1f1f",
                    "on-primary": "#68000f",
                    "on-secondary-container": "#ffd790",
                    "on-secondary-fixed-variant": "#5e4200",
                    "surface-container-lowest": "#0e0e0e",
                    "surface": "#131313",

                    "on-surface": "#e2e2e2",
                    "primary-container": "#ff6b6b",
                    "error": "#ffb4ab",
                    "inverse-on-surface": "#303030",
                    "surface-variant": "#353535",
                    "primary": "#ffb3b0",
                    "on-primary-fixed": "#410006",
                    "on-secondary": "#412d00",
                    "on-error": "#690005",
                    "inverse-surface": "#e2e2e2",
                    "secondary-fixed": "#ffdea7",
                    "secondary-fixed-dim": "#f0bf63",
                    "on-primary-container": "#6d0010",
                    "surface-tint": "#ffb3b0",
                    "on-tertiary": "#2f3131",
                    "surface-bright": "#393939",
                    "on-tertiary-container": "#323333",
                    "secondary": "#f0bf63"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .rainbow-border {
            position: relative;
            background: #131313;
            border-radius: 9999px;
            padding: 2px;
            background-clip: padding-box;
            border: 2px solid transparent;
        }
        .rainbow-border::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff6b6b, #f0bf63, #ffb3b0, #ff6b6b);
            border-radius: 9999px;
            z-index: -1;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Bar -->
<nav class="fixed top-0 w-full flex justify-between items-center px-8 py-6 w-full z-50 bg-[#131313]">
<div class="text-xl font-black tracking-tighter text-[#e2e2e2]">DIALED</div>
<div class="flex items-center gap-6">
<button class="text-[#e0bfbd] hover:text-[#ffb3b0] transition-colors duration-300 flex items-center gap-2 group">
<span class="material-symbols-outlined text-[20px]" data-icon="leaderboard">leaderboard</span>
<span class="text-[10px] uppercase tracking-widest font-medium opacity-0 group-hover:opacity-100 transition-opacity">Leaderboard</span>
</button>
<button class="text-[#e0bfbd] hover:text-[#ffb3b0] transition-colors duration-300">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</nav>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-6 relative z-10">
<!-- Background Ambient Glow -->
<div class="absolute inset-0 flex items-center justify-center -z-10 opacity-20">
<div class="w-[500px] h-[500px] bg-primary rounded-full blur-[120px]"></div>
</div>
<div class="max-w-2xl w-full text-center space-y-12">
<!-- Header Section -->
<div class="space-y-4">
<h1 class="text-7xl md:text-8xl font-black tracking-tighter text-on-surface">
                    color
                </h1>
<p class="text-on-surface-variant text-lg md:text-xl font-medium leading-relaxed max-w-lg mx-auto">
                    Humans can't reliably recall colors. This is a simple game to see how good (or bad) you are at it.
                </p>
</div>
<!-- Mode Selection Section -->
<div class="space-y-10">
<h2 class="text-[10px] uppercase tracking-[0.3em] font-bold text-on-surface-variant opacity-60">
                    Solo or multiplayer?
                </h2>
<div class="flex flex-wrap justify-center items-center gap-8 md:gap-12">
<!-- Solo Mode -->
<div class="flex flex-col items-center gap-4 group">
<button class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-on-surface text-surface flex items-center justify-center hover:scale-95 transition-transform duration-300">
<span class="material-symbols-outlined text-4xl" data-icon="person">person</span>
</button>
<span class="text-[10px] uppercase tracking-widest font-bold text-on-surface opacity-0 group-hover:opacity-100 transition-opacity">Solo</span>
</div>
<!-- Daily Challenge (Rainbow Signature) -->
<div class="flex flex-col items-center gap-4 group">
<div class="rainbow-border hover:scale-95 transition-transform duration-300 cursor-pointer">
<button class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-surface text-on-surface flex items-center justify-center">
<span class="material-symbols-outlined text-4xl" data-icon="calendar_today">calendar_today</span>
</button>
</div>
<span class="text-[10px] uppercase tracking-widest font-bold text-primary">Daily</span>
</div>
<!-- Multiplayer Mode -->
<div class="flex flex-col items-center gap-4 group">
<button class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-on-surface text-surface flex items-center justify-center hover:scale-95 transition-transform duration-300">
<span class="material-symbols-outlined text-4xl" data-icon="group">group</span>
</button>
<span class="text-[10px] uppercase tracking-widest font-bold text-on-surface opacity-0 group-hover:opacity-100 transition-opacity">Party</span>
</div>
</div>
</div>
<!-- Toggle Control -->
<div class="flex items-center justify-center gap-4 pt-8">
<span class="text-[10px] uppercase tracking-widest font-medium text-on-surface-variant">Hard</span>
<button class="w-12 h-6 rounded-full bg-surface-container-highest p-1 flex items-center transition-colors duration-300 group">
<div class="w-4 h-4 rounded-full bg-on-surface-variant group-hover:bg-primary transition-colors"></div>
</button>
<span class="text-[10px] uppercase tracking-widest font-medium text-primary">Easy</span>
</div>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full flex justify-center items-center gap-8 pb-6 w-full text-[10px] opacity-40 hover:opacity-100 transition-opacity duration-500">
<div class="text-[#ffb3b0] uppercase tracking-[0.2em] font-medium">Documentation</div>
<div class="text-[#ffb3b0] uppercase tracking-[0.2em] font-medium">Support</div>
<div class="text-[#ffb3b0] uppercase tracking-[0.2em] font-medium">Privacy</div>
<div class="text-[#584140] uppercase tracking-[0.2em] font-medium ml-4">v1.0.4 obsidian_gallery</div>
</footer>

</div>
</body></html>
